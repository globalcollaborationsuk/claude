<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AccessAbilities Expo Dubai 2026 — Video Ad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; background: #0a0a0a; height: 100%; overflow: hidden; }
    body { font-family: "Space Grotesk", "Helvetica Neue", sans-serif; }
    #root { position: fixed; inset: 0; }
    * { text-wrap: pretty; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="animations.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="video.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "cut": "short",
      "showGuides": false
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      const isLong = t.cut === 'long';
      const duration = isLong ? 40 : 20;

      return (
        <>
          {/* Stage uses a key so duration switch fully resets timeline state */}
          <Stage
            key={t.cut}
            width={W}
            height={H}
            duration={duration}
            background={VCREAM}
            loop={true}
            autoplay={true}
            persistKey={`accessabilities-video:${t.cut}`}
          >
            {isLong ? <LongCut /> : <ShortCut />}

            {t.showGuides && (
              <div style={{
                position: 'absolute', inset: 0, pointerEvents: 'none',
                backgroundImage: 'linear-gradient(rgba(255,0,128,0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(255,0,128,0.15) 1px, transparent 1px)',
                backgroundSize: '60px 60px',
              }} />
            )}
          </Stage>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Cut">
              <TweakRadio
                label="Length"
                value={t.cut}
                onChange={(v) => setTweak('cut', v)}
                options={[
                  { value: 'short', label: 'Short · 20s' },
                  { value: 'long',  label: 'Long · 40s' },
                ]}
              />
            </TweakSection>
            <TweakSection label="Inspect">
              <TweakToggle
                label="Show layout grid"
                value={t.showGuides}
                onChange={(v) => setTweak('showGuides', v)}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
