<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AccessAbilities Expo Dubai 2026 — LinkedIn Video Ad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #0a0a0a; height: 100%; overflow: hidden; }
    body { font-family: "Plus Jakarta Sans", "Inter", sans-serif; }
    #root { position: fixed; inset: 0; }
    * { text-wrap: pretty; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/index.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ============================================================================
    // ANIMATIONS SYSTEM
    // ============================================================================
    const Easing = {
      linear: (t) => t,
      easeInQuad: (t) => t * t,
      easeOutQuad: (t) => t * (2 - t),
      easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
      easeInCubic: (t) => t * t * t,
      easeOutCubic: (t) => (--t) * t * t + 1,
      easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
      easeInQuart: (t) => t * t * t * t,
      easeOutQuart: (t) => 1 - (--t) * t * t * t,
      easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),
      easeInExpo: (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
      easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
      easeInOutExpo: (t) => {
        if (t === 0) return 0;
        if (t === 1) return 1;
        if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
        return 1 - 0.5 * Math.pow(2, -20 * t + 10);
      },
      easeInSine: (t) => 1 - Math.cos((t * Math.PI) / 2),
      easeOutSine: (t) => Math.sin((t * Math.PI) / 2),
      easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
      easeOutBack: (t) => {
        const c1 = 1.70158, c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      },
      easeInBack: (t) => {
        const c1 = 1.70158, c3 = c1 + 1;
        return c3 * t * t * t - c1 * t * t;
      },
      easeInOutBack: (t) => {
        const c1 = 1.70158, c2 = c1 * 1.525;
        return t < 0.5
          ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
          : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
      },
      easeOutElastic: (t) => {
        const c4 = (2 * Math.PI) / 3;
        if (t === 0) return 0;
        if (t === 1) return 1;
        return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
      },
    };

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });
    const useTime = () => React.useContext(TimelineContext).time;
    const useTimeline = () => React.useContext(TimelineContext);

    const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
    const useSprite = () => React.useContext(SpriteContext);

    function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
      const { time } = useTimeline();
      const visible = time >= start && time <= end;
      if (!visible && !keepMounted) return null;

      const duration = end - start;
      const localTime = Math.max(0, time - start);
      const progress = duration > 0 && isFinite(duration)
        ? clamp(localTime / duration, 0, 1)
        : 0;

      const value = { localTime, progress, duration, visible };
      return (
        <SpriteContext.Provider value={value}>
          {typeof children === 'function' ? children(value) : children}
        </SpriteContext.Provider>
      );
    }

    function Stage({
      width = 1280,
      height = 720,
      duration = 10,
      background = '#f6f4ef',
      fps = 60,
      loop = true,
      autoplay = true,
      persistKey = 'animstage',
      children,
    }) {
      const [time, setTime] = React.useState(() => {
        try {
          const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
          return isFinite(v) ? clamp(v, 0, duration) : 0;
        } catch { return 0; }
      });
      const [playing, setPlaying] = React.useState(autoplay);
      const [hoverTime, setHoverTime] = React.useState(null);
      const [scale, setScale] = React.useState(1);

      const stageRef = React.useRef(null);
      const canvasRef = React.useRef(null);
      const rafRef = React.useRef(null);
      const lastTsRef = React.useRef(null);

      React.useEffect(() => {
        try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
      }, [time, persistKey]);

      React.useEffect(() => {
        if (!stageRef.current) return;
        const el = stageRef.current;
        const measure = () => {
          const barH = 44;
          const s = Math.min(
            el.clientWidth / width,
            (el.clientHeight - barH) / height
          );
          setScale(Math.max(0.05, s));
        };
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(el);
        window.addEventListener('resize', measure);
        return () => {
          ro.disconnect();
          window.removeEventListener('resize', measure);
        };
      }, [width, height]);

      React.useEffect(() => {
        if (!playing) {
          lastTsRef.current = null;
          return;
        }
        const step = (ts) => {
          if (lastTsRef.current == null) lastTsRef.current = ts;
          const dt = (ts - lastTsRef.current) / 1000;
          lastTsRef.current = ts;
          setTime((t) => {
            let next = t + dt;
            if (next >= duration) {
              if (loop) next = next % duration;
              else { next = duration; setPlaying(false); }
            }
            return next;
          });
          rafRef.current = requestAnimationFrame(step);
        };
        rafRef.current = requestAnimationFrame(step);
        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          lastTsRef.current = null;
        };
      }, [playing, duration, loop]);

      React.useEffect(() => {
        const onKey = (e) => {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
          if (e.code === 'Space') {
            e.preventDefault();
            setPlaying(p => !p);
          } else if (e.code === 'ArrowLeft') {
            setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
          } else if (e.code === 'ArrowRight') {
            setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
          } else if (e.key === '0' || e.code === 'Home') {
            setTime(0);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [duration]);

      const displayTime = hoverTime != null ? hoverTime : time;
      const ctxValue = React.useMemo(
        () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
        [displayTime, duration, playing]
      );

      return (
        <div
          ref={stageRef}
          style={{
            position: 'absolute', inset: 0,
            display: 'flex', flexDirection: 'column',
            alignItems: 'center',
            background: '#0a0a0a',
            fontFamily: 'Inter, system-ui, sans-serif',
          }}
        >
          <div style={{
            flex: 1,
            width: '100%',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            overflow: 'hidden',
            minHeight: 0,
          }}>
            <div
              ref={canvasRef}
              style={{
                width, height,
                background,
                position: 'relative',
                transform: `scale(${scale})`,
                transformOrigin: 'center',
                flexShrink: 0,
                boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
                overflow: 'hidden',
              }}
            >
              <TimelineContext.Provider value={ctxValue}>
                {children}
              </TimelineContext.Provider>
            </div>
          </div>
          <PlaybackBar
            time={displayTime}
            actualTime={time}
            duration={duration}
            playing={playing}
            onPlayPause={() => setPlaying(p => !p)}
            onReset={() => { setTime(0); }}
            onSeek={(t) => setTime(t)}
            onHover={(t) => setHoverTime(t)}
          />
        </div>
      );
    }

    function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
      const trackRef = React.useRef(null);
      const [dragging, setDragging] = React.useState(false);

      const timeFromEvent = React.useCallback((e) => {
        const rect = trackRef.current.getBoundingClientRect();
        const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
        return x * duration;
      }, [duration]);

      const onTrackMove = (e) => {
        if (!trackRef.current) return;
        const t = timeFromEvent(e);
        if (dragging) {
          onSeek(t);
        } else {
          onHover(t);
        }
      };

      const onTrackLeave = () => {
        if (!dragging) onHover(null);
      };

      const onTrackDown = (e) => {
        setDragging(true);
        const t = timeFromEvent(e);
        onSeek(t);
        onHover(null);
      };

      React.useEffect(() => {
        if (!dragging) return;
        const onUp = () => setDragging(false);
        const onMove = (e) => {
          if (!trackRef.current) return;
          const t = timeFromEvent(e);
          onSeek(t);
        };
        window.addEventListener('mouseup', onUp);
        window.addEventListener('mousemove', onMove);
        return () => {
          window.removeEventListener('mouseup', onUp);
          window.removeEventListener('mousemove', onMove);
        };
      }, [dragging, timeFromEvent, onSeek]);

      const pct = duration > 0 ? (time / duration) * 100 : 0;
      const fmt = (t) => {
        const total = Math.max(0, t);
        const m = Math.floor(total / 60);
        const s = Math.floor(total % 60);
        const cs = Math.floor((total * 100) % 100);
        return `${String(m).padStart(1, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
      };

      const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';

      return (
        <div style={{
          display: 'flex', alignItems: 'center', gap: 12,
          padding: '8px 16px',
          background: 'rgba(20,20,20,0.92)',
          borderTop: '1px solid rgba(255,255,255,0.08)',
          width: '100%',
          maxWidth: 680,
          alignSelf: 'center',
          borderRadius: 8,
          color: '#f6f4ef',
          fontFamily: 'Inter, system-ui, sans-serif',
          userSelect: 'none',
          flexShrink: 0,
        }}>
          <button onClick={onReset} title="Reset (0)" style={{ width: 28, height: 28, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 6, color: '#f6f4ef', cursor: 'pointer', padding: 0 }}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/></svg>
          </button>
          <button onClick={onPlayPause} title="Play/pause (space)" style={{ width: 28, height: 28, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 6, color: '#f6f4ef', cursor: 'pointer', padding: 0 }}>
            {playing ? (
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/></svg>
            ) : (
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2l9 5-9 5V2z" fill="currentColor"/></svg>
            )}
          </button>
          <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums', width: 64, textAlign: 'right', color: '#f6f4ef' }}>{fmt(time)}</div>
          <div ref={trackRef} onMouseMove={onTrackMove} onMouseLeave={onTrackLeave} onMouseDown={onTrackDown} style={{ flex: 1, height: 22, position: 'relative', cursor: 'pointer', display: 'flex', alignItems: 'center' }}>
            <div style={{ position: 'absolute', left: 0, right: 0, height: 4, background: 'rgba(255,255,255,0.12)', borderRadius: 2 }}/>
            <div style={{ position: 'absolute', left: 0, width: `${pct}%`, height: 4, background: 'oklch(72% 0.12 250)', borderRadius: 2 }}/>
            <div style={{ position: 'absolute', left: `${pct}%`, top: '50%', width: 12, height: 12, marginLeft: -6, marginTop: -6, background: '#fff', borderRadius: 6, boxShadow: '0 2px 4px rgba(0,0,0,0.4)' }}/>
          </div>
          <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums', width: 64, textAlign: 'left', color: 'rgba(246,244,239,0.55)' }}>{fmt(duration)}</div>
        </div>
      );
    }

    // ============================================================================
    // TWEAKS PANEL
    // ============================================================================
    const __TWEAKS_STYLE = `
      .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
        max-height:calc(100vh - 32px);display:flex;flex-direction:column;
        background:rgba(250,249,247,.9);color:#29261b;
        border:.5px solid rgba(255,255,255,.6);border-radius:14px;
        box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
        font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
      .twk-hd{display:flex;align-items:center;justify-content:space-between;
        padding:10px 8px 10px 14px;cursor:move;user-select:none}
      .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
      .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
        width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
      .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
      .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
        overflow-y:auto;overflow-x:hidden;min-height:0}
      .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
        color:rgba(41,38,27,.45);padding:10px 0 0}
      .twk-sect:first-child{padding-top:0}
      .twk-row{display:flex;flex-direction:column;gap:5px}
      .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
      .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
      .twk-lbl>span:first-child{font-weight:500}
      .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
      .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;
        border-radius:999px;background:rgba(0,0,0,.12);outline:none}
      .twk-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
        width:14px;height:14px;border-radius:50%;background:#fff;
        border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}
      .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
        background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
      .twk-toggle[data-on="1"]{background:#34c759}
      .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
        background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
      .twk-toggle[data-on="1"] i{transform:translateX(14px)}
      .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
        background:rgba(0,0,0,.06);user-select:none}
      .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
        background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
        transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
      .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
        background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
        border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2;overflow-wrap:anywhere}
    `;

    function useTweaks(defaults) {
      const [values, setValues] = React.useState(defaults);
      const setTweak = React.useCallback((keyOrEdits, val) => {
        const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
          ? keyOrEdits : { [keyOrEdits]: val };
        setValues((prev) => ({ ...prev, ...edits }));
      }, []);
      return [values, setTweak];
    }

    function TweaksPanel({ title = 'Tweaks', children }) {
      const [open, setOpen] = React.useState(false);
      const dragRef = React.useRef(null);
      const offsetRef = React.useRef({ x: 16, y: 16 });
      const PAD = 16;

      const clampToViewport = React.useCallback(() => {
        const panel = dragRef.current;
        if (!panel) return;
        const w = panel.offsetWidth, h = panel.offsetHeight;
        const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
        const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
        offsetRef.current = {
          x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
          y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
        };
        panel.style.right = offsetRef.current.x + 'px';
        panel.style.bottom = offsetRef.current.y + 'px';
      }, []);

      const onDragStart = (e) => {
        const panel = dragRef.current;
        if (!panel) return;
        const r = panel.getBoundingClientRect();
        const sx = e.clientX, sy = e.clientY;
        const startRight = window.innerWidth - r.right;
        const startBottom = window.innerHeight - r.bottom;
        const move = (ev) => {
          offsetRef.current = {
            x: startRight - (ev.clientX - sx),
            y: startBottom - (ev.clientY - sy),
          };
          clampToViewport();
        };
        const up = () => {
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', up);
        };
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
      };

      if (!open) {
        return (
          <button onClick={() => setOpen(true)} style={{
            position: 'fixed', bottom: 16, right: 16, zIndex: 2147483645,
            width: 60, height: 60, borderRadius: 30, background: '#007AFF', color: '#fff',
            border: 'none', fontSize: 18, cursor: 'pointer', boxShadow: '0 4px 12px rgba(0,0,0,0.15)',
          }}>
            ⚙️
          </button>
        );
      }

      return (
        <>
          <style>{__TWEAKS_STYLE}</style>
          <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
            <div className="twk-hd" onMouseDown={onDragStart}>
              <b>{title}</b>
              <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={() => setOpen(false)}>✕</button>
            </div>
            <div className="twk-body">{children}</div>
          </div>
        </>
      );
    }

    function TweakSection({ label, children }) {
      return (
        <>
          <div className="twk-sect">{label}</div>
          {children}
        </>
      );
    }

    function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
      return (
        <div className="twk-row">
          <div className="twk-lbl">
            <span>{label}</span>
            <span className="twk-val">{value}{unit}</span>
          </div>
          <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
        </div>
      );
    }

    function TweakToggle({ label, value, onChange }) {
      return (
        <div className="twk-row twk-row-h">
          <div className="twk-lbl"><span>{label}</span></div>
          <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
        </div>
      );
    }

    function TweakRadio({ label, value, options, onChange }) {
      const trackRef = React.useRef(null);
      const [dragging, setDragging] = React.useState(false);
      const valueRef = React.useRef(value);
      valueRef.current = value;

      const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
      const idx = Math.max(0, opts.findIndex((o) => o.value === value));
      const n = opts.length;

      const segAt = (clientX) => {
        const r = trackRef.current.getBoundingClientRect();
        const inner = r.width - 4;
        const i = Math.floor(((clientX - r.left - 2) / inner) * n);
        return opts[Math.max(0, Math.min(n - 1, i))].value;
      };

      const onPointerDown = (e) => {
        setDragging(true);
        const v0 = segAt(e.clientX);
        if (v0 !== valueRef.current) onChange(v0);
        const move = (ev) => {
          if (!trackRef.current) return;
          const v = segAt(ev.clientX);
          if (v !== valueRef.current) onChange(v);
        };
        const up = () => {
          setDragging(false);
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      };

      return (
        <div className="twk-row">
          <div className="twk-lbl"><span>{label}</span></div>
          <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}

    // ============================================================================
    // EXPORT BUTTON
    // ============================================================================
    function ExportButton({ duration }) {
      const [exporting, setExporting] = React.useState(false);
      const [error, setError] = React.useState(null);
      const [status, setStatus] = React.useState('');
      const ffmpegRef = React.useRef(null);

      const initFFmpeg = React.useCallback(async () => {
        if (ffmpegRef.current?.isLoaded()) return ffmpegRef.current;
        try {
          const { FFmpeg, fetchFile } = FFmpeg;
          const ffmpeg = new FFmpeg.FFmpeg();
          ffmpeg.on('log', ({ message }) => { console.log('[FFmpeg]', message); });
          if (!ffmpeg.isLoaded()) {
            setStatus('Loading FFmpeg...');
            await ffmpeg.load();
          }
          ffmpegRef.current = ffmpeg;
          return ffmpeg;
        } catch (err) {
          throw new Error(`FFmpeg init failed: ${err.message}`);
        }
      }, []);

      const handleExport = async () => {
        try {
          setError(null);
          setExporting(true);
          setStatus('Initializing...');

          const stageContent = document.querySelector('div[style*="position: relative"][style*="transform"]');
          if (!stageContent) {
            throw new Error('Animation canvas not found');
          }

          const canvas = document.createElement('canvas');
          canvas.width = 1080;
          canvas.height = 1920;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });

          const fps = 30;
          const totalFrames = Math.ceil(duration * fps);
          const frames = [];

          setStatus(`Capturing frames (0/${totalFrames})...`);

          for (let i = 0; i < totalFrames; i++) {
            ctx.fillStyle = '#F5EFE3';
            ctx.fillRect(0, 0, 1080, 1920);
            try {
              ctx.drawImage(stageContent, 0, 0);
            } catch (e) {}

            await new Promise((resolve) => {
              canvas.toBlob((blob) => {
                frames.push(blob);
                if ((i + 1) % 10 === 0 || i === totalFrames - 1) {
                  setStatus(`Capturing frames (${i + 1}/${totalFrames})...`);
                }
                resolve();
              }, 'image/png');
            });
          }

          const ffmpeg = await initFFmpeg();

          setStatus('Writing frames to encoder...');
          for (let i = 0; i < frames.length; i++) {
            const data = await frames[i].arrayBuffer();
            ffmpeg.FS('writeFile', `frame${String(i).padStart(6, '0')}.png`, new Uint8Array(data));
            if ((i + 1) % 30 === 0 || i === frames.length - 1) {
              setStatus(`Writing frames (${i + 1}/${frames.length})...`);
            }
          }

          setStatus('Encoding to MP4...');
          await ffmpeg.run('-framerate', String(fps), '-i', 'frame%06d.png', '-c:v', 'libx264', '-preset', 'medium', '-crf', '23', '-pix_fmt', 'yuv420p', 'output.mp4');

          setStatus('Finalizing...');
          const data = ffmpeg.FS('readFile', 'output.mp4');
          const blob = new Blob([data.buffer], { type: 'video/mp4' });

          ffmpeg.FS('unlink', 'output.mp4');
          for (let i = 0; i < frames.length; i++) {
            ffmpeg.FS('unlink', `frame${String(i).padStart(6, '0')}.png`);
          }

          setStatus('Downloading...');
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `innovation-video-${Math.round(duration)}s.mp4`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          setStatus('');
          setExporting(false);
        } catch (err) {
          setError(err.message);
          setExporting(false);
          setStatus('');
          console.error(err);
        }
      };

      return (
        <>
          <div style={{ paddingTop: '10px', borderTop: '1px solid rgba(0,0,0,0.1)' }}>
            <button onClick={handleExport} disabled={exporting} style={{
              width: '100%', padding: '10px 12px', marginTop: '8px',
              background: exporting ? '#888' : '#007AFF', color: '#fff', border: 'none',
              borderRadius: '7px', fontWeight: 600, fontSize: '12px',
              cursor: exporting ? 'not-allowed' : 'pointer', opacity: exporting ? 0.7 : 1,
            }}>
              {exporting ? '⏳ ' : '⬇ '}Download as MP4
            </button>
            {status && <div style={{ marginTop: '8px', padding: '6px 8px', background: '#f0f0f0', color: '#333', borderRadius: '6px', fontSize: '11px', textAlign: 'center' }}>{status}</div>}
            {error && <div style={{ marginTop: '8px', padding: '8px', background: '#ffebee', color: '#c62828', borderRadius: '6px', fontSize: '11px', wordBreak: 'break-word' }}>⚠️ {error}</div>}
          </div>
        </>
      );
    }
