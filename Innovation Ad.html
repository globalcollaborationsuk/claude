<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AccessAbilities Expo Dubai 2026 — LinkedIn Ad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; }
    body { font-family: "Plus Jakarta Sans", "Inter", sans-serif; }
    * { text-wrap: pretty; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="innovation-ad.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="innovation"
            title="Innovation Ad · two formats"
            subtitle="Square (LinkedIn feed) + Portrait (LinkedIn story/9:16). Editable HTML — replace the photo, swap copy, retune colors directly.">
            <DCArtboard id="sq"  label="Square · 1080×1080"   width={1080} height={1080}><SquareAd /></DCArtboard>
            <DCArtboard id="pt"  label="Portrait · 1080×1920" width={1080} height={1920}><PortraitAd /></DCArtboard>
          </DCSection>

          <DCPostIt top={40} left={40} width={320}>
            Recreated from your reference mockups.{'\n\n'}
            Photo is from the upload (cropped). All type, icons, skyline, stats card and CTA are editable HTML/SVG — swap copy or recolor freely.
          </DCPostIt>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
