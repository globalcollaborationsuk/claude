<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AccessAbilities Expo Dubai 2026 — LinkedIn Carousel Ad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; }
    body { font-family: "Space Grotesk", "Helvetica Neue", sans-serif; color: #1B1410; }
    * { text-wrap: pretty; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="carousel.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="carousel"
            title="LinkedIn carousel — 7 slides · 1080×1350"
            subtitle="Editorial direction mirroring accessabilitiesexpo.com — stats-led, accessibility-first type. Use as a LinkedIn document/carousel ad.">
            <DCArtboard id="c1" label="01 · Cover"            width={1080} height={1350}><C1 /></DCArtboard>
            <DCArtboard id="c2" label="02 · Opportunity"      width={1080} height={1350}><C2 /></DCArtboard>
            <DCArtboard id="c3" label="03 · By the numbers"   width={1080} height={1350}><C3 /></DCArtboard>
            <DCArtboard id="c4" label="04 · Sectors"          width={1080} height={1350}><C4 /></DCArtboard>
            <DCArtboard id="c5" label="05 · Why exhibit"      width={1080} height={1350}><C5 /></DCArtboard>
            <DCArtboard id="c6" label="06 · Early-bird"       width={1080} height={1350}><C6 /></DCArtboard>
            <DCArtboard id="c7" label="07 · CTA"              width={1080} height={1350}><C7 /></DCArtboard>
          </DCSection>

          <DCPostIt top={40} left={40} width={320}>
            LinkedIn document carousel.{'\n\n'}
            7 slides at 1080×1350 (LinkedIn's recommended portrait doc-ad ratio).{'\n\n'}
            Data sourced from accessabilitiesexpo.com — stats are official 2026 projections.{'\n\n'}
            Click an artboard's expand icon to view fullscreen.
          </DCPostIt>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
