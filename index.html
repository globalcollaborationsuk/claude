<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ads.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      return (
        <DesignCanvas>
          {/* ─── In-feed previews ─────────────────────────────────────── */}
          <DCSection
            id="infeed"
            title="LinkedIn in-feed previews"

            <DCArtboard id="feed-v2" label="In-feed · V2 Bold ink" width={552} height={1080}>

          {/* ─── Square creatives (1:1, 1080×1080) ────────────────────── */}
          <DCSection
            id="square"

          {/* ─── Landscape ────────────────────────────────────────────── */}
          <DCSection
            id="landscape"
            title="Landscape · 1200×627"
            subtitle="Sponsored content / link share format. Useful when the ad links direct to a landing page.">
            <DCArtboard id="v7" label="V7 · Landscape split" width={1200} height={627}>

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
