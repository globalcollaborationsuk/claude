<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AccessAbilities Expo Dubai 2026 — LinkedIn Video Ad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; background: #0a0a0a; height: 100%; overflow: hidden; }
    body { font-family: "Plus Jakarta Sans", "Inter", sans-serif; }
    #root { position: fixed; inset: 0; }
    * { text-wrap: pretty; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/index.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="animations.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="mp4-export.jsx"></script>
  <script type="text/babel" src="innovation-ad.jsx"></script>
  <script type="text/babel" src="innovation-video.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "contentTop": 120,
      "photoHeight": 560,
      "photoBottom": 280,
      "ctaAnchor": "photoTop",
      "showArc": true,
      "contentGapScale": 1.0,
      "duration": 16,
      "downloadVideo": false
    }/*EDITMODE-END*/;

    // Export button component with MP4 encoding via FFmpeg
    function ExportButton({ duration }) {
      const [exporting, setExporting] = React.useState(false);
      const [error, setError] = React.useState(null);
      const [status, setStatus] = React.useState('');
      const ffmpegRef = React.useRef(null);

      const initFFmpeg = React.useCallback(async () => {
        if (ffmpegRef.current?.isLoaded()) return ffmpegRef.current;

        try {
          const { FFmpeg, fetchFile } = FFmpeg;
          const ffmpeg = new FFmpeg.FFmpeg();

          // Set up logging
          ffmpeg.on('log', ({ message }) => {
            console.log('[FFmpeg]', message);
          });

          if (!ffmpeg.isLoaded()) {
            setStatus('Loading FFmpeg...');
            await ffmpeg.load();
          }

          ffmpegRef.current = ffmpeg;
          return ffmpeg;
        } catch (err) {
          throw new Error(`FFmpeg init failed: ${err.message}`);
        }
      }, []);

      const handleExport = async () => {
        try {
          setError(null);
          setExporting(true);
          setStatus('Initializing...');

          // Find the Stage canvas
          const stageContent = document.querySelector('div[style*="position: relative"][style*="transform"]');
          if (!stageContent) {
            throw new Error('Animation canvas not found');
          }

          // Create capture canvas
          const canvas = document.createElement('canvas');
          canvas.width = 1080;
          canvas.height = 1920;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });

          // Capture frames
          const fps = 30;
          const totalFrames = Math.ceil(duration * fps);
          const frames = [];

          setStatus(`Capturing frames (0/${totalFrames})...`);

          for (let i = 0; i < totalFrames; i++) {
            // Draw background
            ctx.fillStyle = '#F5EFE3';
            ctx.fillRect(0, 0, 1080, 1920);

            // Try to draw stage content
            try {
              ctx.drawImage(stageContent, 0, 0);
            } catch (e) {
              // Silently continue if drawing fails
            }

            // Convert to blob
            await new Promise((resolve) => {
              canvas.toBlob((blob) => {
                frames.push(blob);
                if ((i + 1) % 10 === 0 || i === totalFrames - 1) {
                  setStatus(`Capturing frames (${i + 1}/${totalFrames})...`);
                }
                resolve();
              }, 'image/png');
            });
          }

          // Initialize FFmpeg
          const ffmpeg = await initFFmpeg();

          // Write frames to FFmpeg filesystem
          setStatus('Writing frames to encoder...');
          for (let i = 0; i < frames.length; i++) {
            const data = await frames[i].arrayBuffer();
            ffmpeg.FS('writeFile', `frame${String(i).padStart(6, '0')}.png`, new Uint8Array(data));
            if ((i + 1) % 30 === 0 || i === frames.length - 1) {
              setStatus(`Writing frames (${i + 1}/${frames.length})...`);
            }
          }

          // Encode to MP4
          setStatus('Encoding to MP4 (this may take a minute)...');
          await ffmpeg.run(
            '-framerate', String(fps),
            '-i', 'frame%06d.png',
            '-c:v', 'libx264',
            '-preset', 'medium',
            '-crf', '23',
            '-pix_fmt', 'yuv420p',
            'output.mp4'
          );

          // Read output file
          setStatus('Finalizing...');
          const data = ffmpeg.FS('readFile', 'output.mp4');
          const blob = new Blob([data.buffer], { type: 'video/mp4' });

          // Clean up files
          ffmpeg.FS('unlink', 'output.mp4');
          for (let i = 0; i < frames.length; i++) {
            ffmpeg.FS('unlink', `frame${String(i).padStart(6, '0')}.png`);
          }

          // Download
          setStatus('Downloading...');
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `innovation-video-${Math.round(duration)}s.mp4`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          setStatus('');
          setExporting(false);

        } catch (err) {
          setError(err.message);
          setExporting(false);
          setStatus('');
          console.error(err);
        }
      };

      return (
        <>
          <div style={{ paddingTop: '10px', borderTop: '1px solid rgba(0,0,0,0.1)' }}>
            <button
              onClick={handleExport}
              disabled={exporting}
              style={{
                width: '100%',
                padding: '10px 12px',
                marginTop: '8px',
                background: exporting ? '#888' : '#007AFF',
                color: '#fff',
                border: 'none',
                borderRadius: '7px',
                fontWeight: 600,
                fontSize: '12px',
                cursor: exporting ? 'not-allowed' : 'pointer',
                opacity: exporting ? 0.7 : 1,
                transition: 'all 0.2s',
              }}
            >
              {exporting ? '⏳ ' : '⬇ '}
              Download as MP4
            </button>

            {status && (
              <div style={{
                marginTop: '8px',
                padding: '6px 8px',
                background: '#f0f0f0',
                color: '#333',
                borderRadius: '6px',
                fontSize: '11px',
                textAlign: 'center',
              }}>
                {status}
              </div>
            )}

            {error && (
              <div style={{
                marginTop: '8px',
                padding: '8px',
                background: '#ffebee',
                color: '#c62828',
                borderRadius: '6px',
                fontSize: '11px',
                wordBreak: 'break-word',
              }}>
                ⚠️ {error}
              </div>
            )}
          </div>
        </>
      );
    }

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      // Trigger export when downloadVideo toggle is turned on
      React.useEffect(() => {
        if (t.downloadVideo) {
          setTimeout(() => {
            document.querySelector('button[style*="background"]')?.click?.();
            setTweak('downloadVideo', false);
          }, 100);
        }
      }, [t.downloadVideo, setTweak]);

      return (
        <>
          <Stage
            key={`${t.duration}`}
            width={1080}
            height={1920}
            duration={t.duration}
            background="#F5EFE3"
            loop={true}
            autoplay={true}
            persistKey="innovation-video"
          >
            <InnovationVideo
              contentTop={t.contentTop}
              photoHeight={t.photoHeight}
              photoBottom={t.photoBottom}
              ctaAnchor={t.ctaAnchor}
              showArc={t.showArc}
              contentGapScale={t.contentGapScale}
            />
          </Stage>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Layout">
              <TweakSlider
                label="Content top"
                value={t.contentTop}
                min={40} max={400} step={10} unit="px"
                onChange={(v) => setTweak('contentTop', v)} />
              <TweakSlider
                label="Gap scale"
                value={t.contentGapScale}
                min={0.6} max={1.4} step={0.05}
                onChange={(v) => setTweak('contentGapScale', v)} />
            </TweakSection>

            <TweakSection label="Bottom photo">
              <TweakSlider
                label="Height"
                value={t.photoHeight}
                min={300} max={780} step={20} unit="px"
                onChange={(v) => setTweak('photoHeight', v)} />
              <TweakSlider
                label="Lift from bottom"
                value={t.photoBottom}
                min={0} max={400} step={10} unit="px"
                onChange={(v) => setTweak('photoBottom', v)} />
            </TweakSection>

            <TweakSection label="CTA position">
              <TweakRadio
                label="Anchor"
                value={t.ctaAnchor}
                options={[
                  { value: 'inline',      label: 'Inline' },
                  { value: 'photoTop',    label: 'Photo top' },
                  { value: 'photoCenter', label: 'Centred' },
                ]}
                onChange={(v) => setTweak('ctaAnchor', v)} />
            </TweakSection>

            <TweakSection label="Decoration">
              <TweakToggle
                label="Top-right arc"
                value={t.showArc}
                onChange={(v) => setTweak('showArc', v)} />
            </TweakSection>

            <TweakSection label="Timing">
              <TweakSlider
                label="Duration"
                value={t.duration}
                min={10} max={24} step={1} unit="s"
                onChange={(v) => setTweak('duration', v)} />
            </TweakSection>

            <TweakSection label="Export">
              <TweakToggle
                label="Download as WebM"
                value={t.downloadVideo}
                onChange={(v) => setTweak('downloadVideo', v)} />
            </TweakSection>

            <ExportButton duration={t.duration} />
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
